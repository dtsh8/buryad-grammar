name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # tags, CHANGELOG commit, GitHub release
  issues: write # @semantic-release/github comments on released issues
  pull-requests: write # …and on released PRs

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same install as CI: some dev dependencies have unresolved peer ranges.
      - run: npm ci --legacy-peer-deps

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          # .releaserc.json uses the "conventionalcommits" preset, which ships separately.
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
